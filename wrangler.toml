name = "tg-greek-openai-bot"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Привязка KV для хранения состояния
[[kv_namespaces]]
binding = "GREEK_KV"
id = "018977951b09462ab4e4003994f7f49c" # Создай namespace в дашборде Cloudflare и вставь ID

# Cron Trigger: запуск каждый день в 6:00 UTC
[triggers]
crons = ["0 6 * * *"]

[observability]
enabled = true

[observability.logs]
invocation_logs = true